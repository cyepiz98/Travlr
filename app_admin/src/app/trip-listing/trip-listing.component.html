<div class="container mt-4">
  <div class="row mb-3">
    <div class="col-md-4">
      <button class="btn btn-info" (click)="addTrip()">Add Trip</button>
    </div>
  </div>

  <div class="row">
    <div class="col-md-4 col-sm-12 mb-4" *ngFor="let trip of trips">
      <app-trip-card [trip]="trip"></app-trip-card>
    </div>
  </div>
</div>
